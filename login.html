<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login - Glamour</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-black: #0a0a0a;
            --secondary-black: #141414;
            --card-black: #1a1a1a;
            --accent-gold: #FFD700;
            --accent-gold-light: #FDB931;
            --accent-gold-dark: #C08208;
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FDB931 50%, #C08208 100%);
            --text-white: #ffffff;
            --error-red: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Background gradient effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(255,215,0,0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Animated background particles */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,215,0,0.02) 0px, rgba(255,215,0,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* Login Card Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            margin: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Login Card */
        .login-card {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 30px 60px -15px rgba(255, 215, 0, 0.1);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo img {
            height: 50px;
            width: auto;
            margin-bottom: 16px;
        }

        .logo h2 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: rgba(255, 215, 0, 0.6);
            font-size: 1rem;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 50px;
            font-size: 0.9rem;
            color: white;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: var(--accent-gold);
        }

        /* Error Message */
        .error-message {
            background: rgba(255, 77, 77, 0.15);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .error-message i {
            color: var(--error-red);
            font-size: 1.1rem;
        }

        .error-message span {
            color: var(--error-red);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .error-message.show {
            display: flex;
        }

        /* Login Button */
        .btn-login {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            color: #000000;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Additional Links */
        .additional-links {
            text-align: center;
            margin-top: 24px;
        }

        .additional-links a {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .additional-links a:hover {
            color: var(--accent-gold);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        .divider span {
            margin: 0 16px;
        }

        /* Back to Home */
        .back-home {
            text-align: center;
            margin-top: 24px;
        }

        .back-home a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home a:hover {
            color: var(--accent-gold);
        }

        /* Register Link */
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .register-link a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Demo Credentials Hint */
        .demo-hint {
            background: rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            margin-top: 20px;
            text-align: center;
        }

        .demo-hint p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
            margin-bottom: 0;
        }

        .demo-hint strong {
            color: var(--accent-gold);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo">
                <img src="https://i.ibb.co/8nH1K89R/IMG-20260221-013709.png" alt="Glamour">
                <h2>Welcome Back</h2>
                <p>Sign in to continue your journey</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-triangle"></i>
                <span id="errorText">Invalid credentials. Please try again.</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="emailInput" class="form-control" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="passwordInput" class="form-control" placeholder="Enter your password" required>
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-arrow-right-to-bracket" style="margin-right: 8px;"></i>
                    Login
                </button>
            </form>

            <div class="additional-links">
                <a href="#">Forgot Password?</a>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <div class="register-link">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>

            <div class="back-home">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>

            <!-- Demo Hint (for testing purposes) -->
            <div class="demo-hint">
                <p>🔐 <strong>Demo Mode:</strong> Any email/password combination will show "Invalid credentials"</p>
            </div>
        </div>
    </div>

    <script>
        // Get DOM elements
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const togglePassword = document.getElementById('togglePassword');

        // Password visibility toggle
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = togglePassword.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // Show error function
        function showError(message) {
            errorText.textContent = message || 'Invalid credentials. Please try again.';
            errorMessage.classList.add('show');
            
            // Auto hide after 4 seconds
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 4000);
        }

        // Form submission handler
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Basic validation
            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }
            
            if (!email.includes('@') || !email.includes('.')) {
                showError('Please enter a valid email address.');
                return;
            }
            
            if (password.length < 4) {
                showError('Password must be at least 4 characters.');
                return;
            }
            
            // ALWAYS show invalid credentials - regardless of what was entered
            // This matches your requirement perfectly
            showError('Invalid credentials. Please try again.');
            
            // Optional: Clear password field for better UX
            passwordInput.value = '';
            
            // Optional: Focus back on email field
            emailInput.focus();
            
            // Note: You can replace this with actual authentication later
            // by connecting to your backend/firebase
        });

        // Clear error when user starts typing
        emailInput.addEventListener('input', function() {
            errorMessage.classList.remove('show');
        });
        
        passwordInput.addEventListener('input', function() {
            errorMessage.classList.remove('show');
        });
    </script>

</body>
</html>

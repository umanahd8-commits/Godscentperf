<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Register - Glamour</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-black: #0a0a0a;
            --secondary-black: #141414;
            --card-black: #1a1a1a;
            --accent-gold: #FFD700;
            --accent-gold-light: #FDB931;
            --accent-gold-dark: #C08208;
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FDB931 50%, #C08208 100%);
            --text-white: #ffffff;
            --success-green: #4caf50;
            --error-red: #ff4d4d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--primary-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* Background gradient effect */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(255,215,0,0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Animated background particles */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,215,0,0.02) 0px, rgba(255,215,0,0.02) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* Register Card Container */
        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Register Card */
        .register-card {
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .register-card:hover {
            border-color: rgba(255, 215, 0, 0.3);
            box-shadow: 0 30px 60px -15px rgba(255, 215, 0, 0.1);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo img {
            height: 50px;
            width: auto;
            margin-bottom: 16px;
        }

        .logo h2 {
            font-size: 1.75rem;
            font-weight: 700;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        /* Form Groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: rgba(255, 215, 0, 0.6);
            font-size: 1rem;
            pointer-events: none;
            z-index: 1;
        }

        .form-control, .form-select {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 50px;
            font-size: 0.9rem;
            color: white;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            appearance: none;
        }

        .form-select {
            padding-right: 45px;
            cursor: pointer;
        }

        .form-select option {
            background: var(--secondary-black);
            color: white;
        }

        .form-control:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.1);
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Two columns row */
        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            transition: color 0.3s;
            z-index: 2;
        }

        .password-toggle:hover {
            color: var(--accent-gold);
        }

        /* Success Message */
        .success-message {
            background: rgba(76, 175, 80, 0.15);
            border: 1px solid rgba(76, 175, 80, 0.3);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .success-message.show {
            display: flex;
        }

        .success-message i {
            color: var(--success-green);
            font-size: 1.1rem;
        }

        .success-message span {
            color: var(--success-green);
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Register Button */
        .btn-register {
            width: 100%;
            background: var(--gold-gradient);
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            color: #000000;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            margin-bottom: 20px;
            font-family: 'Poppins', sans-serif;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Login Link */
        .login-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
            margin-top: 20px;
        }

        .login-link a {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Back to Home */
        .back-home {
            text-align: center;
            margin-top: 24px;
        }

        .back-home a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .back-home a:hover {
            color: var(--accent-gold);
        }

        /* Terms text */
        .terms-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            margin-top: 20px;
        }

        .terms-text a {
            color: rgba(255, 215, 0, 0.6);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .register-card {
                padding: 30px 20px;
            }
            
            .row-inputs {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-card">
            <!-- Logo -->
            <div class="logo">
                <img src="https://i.ibb.co/8nH1K89R/IMG-20260221-013709.png" alt="Glamour">
                <h2>Create Account</h2>
                <p>Join the Glamour movement today</p>
            </div>

            <!-- Success Message -->
            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span>Registration successful! Redirecting...</span>
            </div>

            <!-- Registration Form -->
            <form id="registerForm">
                <!-- Full Name -->
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" class="form-control" placeholder="+1234567890" required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="Create a password" required>
                        <button type="button" id="togglePassword" class="password-toggle">
                            <i class="fas fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <!-- Country (Two fields: Country and Country Code) -->
                <div class="row-inputs">
                    <div class="form-group">
                        <label>Country</label>
                        <div class="input-wrapper">
                            <i class="fas fa-globe-africa"></i>
                            <select id="country" class="form-select" required>
                                <option value="" disabled selected>Select country</option>
                                <option value="Nigeria">Nigeria</option>
                                <option value="Ghana">Ghana</option>
                                <option value="Kenya">Kenya</option>
                                <option value="South Africa">South Africa</option>
                                <option value="Egypt">Egypt</option>
                                <option value="Morocco">Morocco</option>
                                <option value="Ethiopia">Ethiopia</option>
                                <option value="Tanzania">Tanzania</option>
                                <option value="Uganda">Uganda</option>
                                <option value="Algeria">Algeria</option>
                                <option value="Sudan">Sudan</option>
                                <option value="Angola">Angola</option>
                                <option value="Cameroon">Cameroon</option>
                                <option value="Ivory Coast">Ivory Coast</option>
                                <option value="Senegal">Senegal</option>
                                <option value="Zimbabwe">Zimbabwe</option>
                                <option value="Zambia">Zambia</option>
                                <option value="Rwanda">Rwanda</option>
                                <option value="Botswana">Botswana</option>
                                <option value="Namibia">Namibia</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Country Code</label>
                        <div class="input-wrapper">
                            <i class="fas fa-code"></i>
                            <select id="countryCode" class="form-select" required>
                                <option value="" disabled selected>Select code</option>
                                <option value="+234">🇳🇬 +234 (Nigeria)</option>
                                <option value="+233">🇬🇭 +233 (Ghana)</option>
                                <option value="+254">🇰🇪 +254 (Kenya)</option>
                                <option value="+27">🇿🇦 +27 (South Africa)</option>
                                <option value="+20">🇪🇬 +20 (Egypt)</option>
                                <option value="+212">🇲🇦 +212 (Morocco)</option>
                                <option value="+251">🇪🇹 +251 (Ethiopia)</option>
                                <option value="+255">🇹🇿 +255 (Tanzania)</option>
                                <option value="+256">🇺🇬 +256 (Uganda)</option>
                                <option value="+213">🇩🇿 +213 (Algeria)</option>
                                <option value="+249">🇸🇩 +249 (Sudan)</option>
                                <option value="+244">🇦🇴 +244 (Angola)</option>
                                <option value="+237">🇨🇲 +237 (Cameroon)</option>
                                <option value="+225">🇨🇮 +225 (Ivory Coast)</option>
                                <option value="+221">🇸🇳 +221 (Senegal)</option>
                                <option value="+263">🇿🇼 +263 (Zimbabwe)</option>
                                <option value="+260">🇿🇲 +260 (Zambia)</option>
                                <option value="+250">🇷🇼 +250 (Rwanda)</option>
                                <option value="+267">🇧🇼 +267 (Botswana)</option>
                                <option value="+264">🇳🇦 +264 (Namibia)</option>
                                <option value="+1">🇺🇸 +1 (USA)</option>
                                <option value="+44">🇬🇧 +44 (UK)</option>
                                <option value="+91">🇮🇳 +91 (India)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <button type="submit" id="registerBtn" class="btn-register">
                    <i class="fas fa-user-plus" style="margin-right: 8px;"></i>
                    Create Account
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Sign In</a>
            </div>

            <div class="back-home">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
            </div>

            <div class="terms-text">
                By creating an account, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </div>
        </div>
    </div>

    <script>
        // Get DOM elements
        const registerForm = document.getElementById('registerForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const passwordInput = document.getElementById('password');
        const countrySelect = document.getElementById('country');
        const countryCodeSelect = document.getElementById('countryCode');
        const registerBtn = document.getElementById('registerBtn');
        const successMessage = document.getElementById('successMessage');
        const togglePassword = document.getElementById('togglePassword');

        // Password visibility toggle
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = togglePassword.querySelector('i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        // Show success and redirect (no validation, just collect and redirect)
        function showSuccessAndRedirect() {
            successMessage.classList.add('show');
            
            // Disable the button to prevent multiple submissions
            registerBtn.disabled = true;
            registerBtn.style.opacity = '0.7';
            registerBtn.textContent = 'Redirecting...';
            
            // Store user data in localStorage (optional - can be used in products.html)
            const userData = {
                fullName: fullNameInput.value.trim(),
                email: emailInput.value.trim(),
                phone: phoneInput.value.trim(),
                country: countrySelect.value,
                countryCode: countryCodeSelect.value,
                registeredAt: new Date().toISOString()
            };
            
            localStorage.setItem('glamourUser', JSON.stringify(userData));
            
            // Redirect to products.html after 1 second
            setTimeout(() => {
                window.location.href = 'products.html';
            }, 1000);
        }

        // Form submission handler - NO VALIDATION, just redirect
        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Store whatever the user entered (even if empty)
            const userData = {
                fullName: fullNameInput.value || "Not provided",
                email: emailInput.value || "Not provided",
                phone: phoneInput.value || "Not provided",
                country: countrySelect.value || "Not selected",
                countryCode: countryCodeSelect.value || "Not selected",
                registeredAt: new Date().toISOString()
            };
            
            localStorage.setItem('glamourUser', JSON.stringify(userData));
            
            // Show success message and redirect immediately
            showSuccessAndRedirect();
        });
    </script>

</body>
</html>.
